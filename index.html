/* ================= COLLECTION MATH ================= */
function calcPeriod(visits,expenses,payments,from,to){
const v=visits.filter(x=>x.status!=="Cancelled"&&inRange(x.date,from,to));
const ex=expenses.filter(x=>inRange(x.date,from,to));
const extra=payments.filter(x=>inRange(x.date,from,to));
const sum=a=>a.reduce((t,n)=>t+(n||0),0);
const extraAmt=sum(extra.map(x=>x.amount));
const received=sum(v.map(x=>x.received))+extraAmt;
const exp=sum(ex.map(x=>x.amount));
return{count:v.length,opd:sum(v.map(x=>x.opdFee)),lab:sum(v.map(x=>x.labTotal)),ultra:sum(v.map(x=>x.ultraTotal)),
other:sum(v.map(x=>x.otherTotal)),gross:sum(v.map(x=>x.total)),discount:sum(v.map(x=>x.discount)),
received:received,due:sum(v.map(x=>x.due)),expenses:exp,net:received-exp,extraPayments:extraAmt};
}

function pageReports(){
const s=app.settings,C=s.currency;
const TYPES=[["daily-patients","Daily Patient Report"],["daily-collection","Daily Collection Report"],["monthly-collection","Monthly Collection Report"],["doctor-patients","Doctor-wise Patients"],["doctor-collection","Doctor-wise Collection & Commission"],["lab","Laboratory Report"],["ultrasound","Ultrasound Report"],["expenses","Expense Report"],["dues","Due / Balance Report"],["patient-history","Patient History Report"],["audit","Audit Log / Activity Report"]];
let type="daily-patients",from=today(),to=today(),mrq="";
const build=()=>{
const visits=app.visits.filter(v=>v.status!=="Cancelled"&&inRange(v.date,from,to));
const P=calcPeriod(app.visits,app.expenses,app.payments,from,to);
const T=x=>fmtMoney(x);
switch(type){
case"daily-patients":return{title:"Daily Patient Report",
headers:["Date","Token","MR No","Patient","Age/Gender","Mobile","Doctor","Time","Total","Status"],
align:["left","center","left","left","center","left","left","center","right","center"],
rows:visits.map(v=>[fmtDate(v.date),v.token,padMr(v.patientId),v.patientName,v.age+" "+v.ageUnit+"/"+v.gender,v.mobile,v.doctorName||"-",fmtTime(v.time),T(v.total),v.status]),
summary:[["Total Patients",String(visits.length)],["Male",String(visits.filter(v=>v.gender==="Male").length)],["Female",String(visits.filter(v=>v.gender==="Female").length)],["Gross Billing",C+" "+T(P.gross)]]};
case"daily-collection":{
const dates=Array.from(new Set(visits.map(v=>v.date))).sort().reverse();
return{title:"Daily Collection Report",
headers:["Date","Patients","OPD","Lab","Ultrasound","Other","Discount","Gross","Received","Due","Expenses","Net"],
align:["left","center","right","right","right","right","right","right","right","right","right","right"],
rows:dates.map(d=>{const q=calcPeriod(app.visits,app.expenses,app.payments,d,d);return[fmtDate(d),q.count,T(q.opd),T(q.lab),T(q.ultra),T(q.other),T(q.discount),T(q.gross),T(q.received),T(q.due),T(q.expenses),T(q.net)]}),
summary:[["OPD Collection",C+" "+T(P.opd)],["Laboratory Collection",C+" "+T(P.lab)],["Ultrasound Collection",C+" "+T(P.ultra)],["Gross Billing",C+" "+T(P.gross)],["Total Received",C+" "+T(P.received)],["Outstanding Due",C+" "+T(P.due)],["Total Expenses",C+" "+T(P.expenses)],["NET COLLECTION",C+" "+T(P.net)]]}}
case"monthly-collection":{
const months=Array.from(new Set(app.visits.map(v=>v.date.slice(0,7)))).sort().reverse();
return{title:"Monthly Collection Report",
headers:["Month","Patients","OPD","Lab","Ultrasound","Gross","Received","Due","Expenses","Net"],
align:["left","center","right","right","right","right","right","right","right","right"],
rows:months.map(m=>{const q=calcPeriod(app.visits,app.expenses,app.payments,m+"-01",m+"-31");return[m,q.count,T(q.opd),T(q.lab),T(q.ultra),T(q.gross),T(q.received),T(q.due),T(q.expenses),T(q.net)]})}}
case"doctor-patients":case"doctor-collection":{
const rows=app.doctors.map(d=>{
const vs=visits.filter(v=>v.doctorId===d.id);
const fees=vs.reduce((a,v)=>a+v.opdFee,0),tot=vs.reduce((a,v)=>a+v.total,0);
const comm=d.commissionEnabled?Math.round(fees*d.commissionPercent/100):0;
return[d.name,d.specialization,vs.length,T(fees),T(tot),d.commissionEnabled?d.commissionPercent+"%":"-",T(comm),T(fees-comm)]});
const noDoc=visits.filter(v=>!v.doctorId);
if(noDoc.length)rows.push(["(No Doctor / Lab only)","-",noDoc.length,T(noDoc.reduce((a,v)=>a+v.opdFee,0)),T(noDoc.reduce((a,v)=>a+v.total,0)),"-","0",T(noDoc.reduce((a,v)=>a+v.opdFee,0))]);
return{title:type==="doctor-patients"?"Doctor-wise Patients Report":"Doctor-wise Collection & Commission",
headers:["Doctor","Specialization","Patients","OPD Collection","Total Billed","Commission %","Commission","Payable to Clinic"],
align:["left","left","center","right","right","center","right","right"],rows:rows,
summary:[["Total Patients",String(visits.length)],["Total OPD Collection",C+" "+T(P.opd)]]}}
case"lab":case"ultrasound":{
const cat=type,rows=[];let total=0;
visits.forEach(v=>v.items.filter(i=>i.category===cat).forEach(i=>{rows.push([fmtDate(v.date),v.token,padMr(v.patientId),v.patientName,v.doctorName||"-",i.description,i.qty,T(i.amount)]);total+=i.amount}));
return{title:type==="lab"?"Laboratory Report":"Ultrasound Report",
headers:["Date","Token","MR No","Patient","Doctor",type==="lab"?"Test":"Study","Qty","Amount"],
align:["left","center","left","left","left","left","center","right"],rows:rows,
summary:[["Total Items",String(rows.length)],["Total Collection",C+" "+T(total)]]}}
case"expenses":{
const list=app.expenses.filter(e=>inRange(e.date,from,to));
return{title:"Expense Report",headers:["Date","Category","Description","Paid To","Entered By","Amount"],
align:["left","left","left","left","left","right"],
rows:list.map(e=>[fmtDate(e.date),e.category,e.description,e.paidTo||"-",e.createdBy,T(e.amount)]),
summary:[["Total Expenses",C+" "+T(list.reduce((a,b)=>a+b.amount,0))]]}}
case"dues":{
const list=app.visits.filter(v=>v.due>0&&v.status!=="Cancelled"&&inRange(v.date,from,to));
return{title:"Due / Balance Report",headers:["Date","MR No","Patient","Mobile","Doctor","Total","Received","Balance Due"],
align:["left","left","left","left","left","right","right","right"],
rows:list.map(v=>[fmtDate(v.date),padMr(v.patientId),v.patientName,v.mobile||"-",v.doctorName||"-",T(v.total),T(v.received),T(v.due)]),
summary:[["Patients with Balance",String(list.length)],["TOTAL OUTSTANDING",C+" "+T(list.reduce((a,b)=>a+b.due,0))]]}}
case"patient-history":{
const q=mrq.trim(),dg=q.replace(/\D/g,"");
const p=app.patients.find(x=>x.patientId.toLowerCase()===q.toLowerCase())||(dg?app.patients.find(x=>Number(mrDigits(x.patientId))===Number(dg)):null);
const vs=p?app.visits.filter(v=>v.patientId===p.patientId):[];
return{title:"Patient History Report",
subtitle:p?padMr(p.patientId)+" — "+p.name+" • "+p.age+" "+p.ageUnit+" • "+p.gender+" • "+p.mobile:"Enter a valid MR number above",
headers:["Date","Token","Doctor","Charges","Diagnosis","Total","Received","Due"],
align:["left","center","left","left","left","right","right","right"],
rows:vs.map(v=>[fmtDate(v.date),v.token,v.doctorName||"-",v.items.map(i=>i.description).join(", "),v.diagnosis||"-",T(v.total),T(v.received),T(v.due)]),
summary:[["Total Visits",String(vs.length)],["Total Billed",C+" "+T(vs.reduce((a,b)=>a+b.total,0))],["Total Received",C+" "+T(vs.reduce((a,b)=>a+b.received,0))],["Outstanding",C+" "+T(vs.reduce((a,b)=>a+b.due,0))]]}}
default:{
const list=app.audit.filter(a=>inRange(a.ts.slice(0,10),from,to));
return{title:"Audit Log / Activity Report",headers:["Date / Time","User","Action","Module","Reference","Details"],
align:["left","left","left","left","left","left"],
rows:list.map(a=>[new Date(a.ts).toLocaleString(),a.user,a.action,a.entity,a.entityId,a.details]),
summary:[["Total Activities",String(list.length)]]}}
}
};

$("#rs-btn").onclick=()=>$("#rs-file").click();
$("#rs-file").addEventListener("change",async e=>{
const file=e.target.files&&e.target.files[0];if(!file)return;
try{
const txt=await readAsText(file);const pkg=JSON.parse(txt);
if(!pkg||!pkg.data||typeof pkg.data!=="object"){toast("This file is not a valid backup file","error");return}
const total=Object.values(pkg.data).reduce((a,arr)=>a+(Array.isArray(arr)?arr.length:0),0);
const mode=$("#rs-mode").value;
const ok=await confirmBox({title:mode==="replace"?"Replace Entire Database":"Merge Backup Into Database",
message:mode==="replace"?"This will DELETE all current records in the database and restore "+total+" record(s) from the backup taken on "+new Date(pkg.exportedAt).toLocaleString()+". This cannot be undone.":"This will add/update "+total+" record(s) from the backup taken on "+new Date(pkg.exportedAt).toLocaleString()+". Existing records with the same ID will be overwritten.",
danger:mode==="replace",confirmText:mode==="replace"?"REPLACE ALL DATA":"MERGE DATA",requireText:mode==="replace"?"RESTORE":null});
if(!ok)return;
for(const st of STORES){const arr=pkg.data[st];if(!Array.isArray(arr))continue;if((st==="users"||st==="settings")&&!isOwner())continue;
if(mode==="replace")await qClear(st);await qBulk(st,arr)}
await loadData();
await audit(app.user.username,"RESTORE","database","all",mode+" restore of "+total+" records");
toast("Database restored successfully ("+total+" records)");go("backup");
}catch(err){console.error(err);toast("Could not read that backup file","error")}
e.target.value="";
});
$("#bk-erase").onclick=async()=>{
if(!await confirmBox({title:"Erase Entire Server Database",message:"This permanently deletes ALL patients, visits, doctors, tests, expenses, users and settings from the MySQL database. Export a backup first! This action cannot be undone.",danger:true,confirmText:"ERASE EVERYTHING",requireText:"ERASE"}))return;
for(const st of STORES)await qClear(st);
await loadData();toast("Database erased. Reloading to re-initialise…","info");
setTimeout(()=>location.reload(),1500);
};

/* ============================================================
AI AGENT  (server /api/agent — sirf isi clinic ka data)
============================================================ */
const AG_SUGGEST=["Aaj kitni collection hui?","Aaj ke patients dikhao","Kis ka due baqaya hai?","Doctor-wise report","Is mahine ka kharcha aur net","Pichle 7 din ka khulasa","Low stock dawaiyan","Aaj ki appointments"];
let AG_HIST=[];
function agMd(t){
const lines=esc(t).split("\n");let out="",inUl=false,tbl=[];
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const flushT=()=>{if(!tbl.length)return;const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r.replace(/\s/g,"")));
out+="<table>"+rows.map((r,i)=>{const c=r.replace(/^\||\|$/g,"").split("|").map(x=>inl(x.trim()));return "<tr>"+c.map(x=>i===0?"<th>"+x+"</th>":"<td>"+x+"</td>").join("")+"</tr>"}).join("")+"</table>";tbl=[]};
const flushU=()=>{if(inUl){out+="</ul>";inUl=false}};
for(const ln of lines){
if(/^\s*\|/.test(ln)){flushU();tbl.push(ln);continue}
flushT();
if(/^\s*[-*•]\s+/.test(ln)){if(!inUl){out+="<ul>";inUl=true}out+="<li>"+inl(ln.replace(/^\s*[-*•]\s+/,""))+"</li>";continue}
flushU();
if(!ln.trim())continue;
out+="<p>"+inl(ln.replace(/^#+\s*/,"<b>")+(/^#+\s/.test(ln)?"</b>":""))+"</p>";
}
flushT();flushU();return out;
}
function pageAgent(){
let busy=false;
$("#page").innerHTML=
'<div class="card"><div class="ag-wrap">'+
'<div class="ag-head"><div style="font-size:26px">🤖</div><div style="flex:1;min-width:150px"><h2 style="font-size:16px;font-weight:800">Clinic AI Assistant</h2><div class="sub" style="font-size:12px;color:var(--slate-500)">'+esc(app.settings.clinicName)+' — sirf is clinic ka live database</div></div>'+
'<span class="ag-badge off" id="ag-st">● checking…</span><button class="btn btn-outline sm" id="ag-clear">🗑 Clear</button></div>'+
'<div class="ag-msgs" id="ag-msgs"></div>'+
'<div class="ag-chips" id="ag-chips">'+AG_SUGGEST.map(q=>'<button class="ag-chip" data-q="'+esc(q)+'">'+esc(q)+'</button>').join("")+'</div>'+
'<div class="ag-in"><textarea id="ag-q" placeholder="Sawal likhein… (English / Urdu / Roman Urdu)"></textarea><button class="btn btn-primary" id="ag-send">SEND ➤</button></div>'+
'</div></div>';
const box=$("#ag-msgs");
const add=(role,html,meta)=>{const d=document.createElement("div");d.className="ag-m "+(role==="user"?"u":"a");d.innerHTML=html+(meta?'<div class="ag-meta">'+meta+'</div>':'');box.appendChild(d);box.scrollTop=box.scrollHeight;return d};
const welcome=()=>add("assistant","<p><b>Assalam o Alaikum, "+esc(app.user.fullName)+"!</b></p><p>Main "+esc(app.settings.clinicName)+" ke database se jawab deta hoon — collection, patients, dues, doctors, kharcha, stock, appointments. Neeche se sawal chunein ya khud likhein.</p>");
if(AG_HIST.length){AG_HIST.forEach(h=>add(h.role,h.role==="user"?esc(h.text):agMd(h.text)))}else welcome();
api("GET","/api/agent/status").then(s=>{const b=$("#ag-st");if(!b)return;if(s.ai){b.className="ag-badge";b.textContent="● AI ON — "+s.provider}else{b.className="ag-badge off";b.textContent="● Offline mode (database se seedha jawab)"}}).catch(()=>{const b=$("#ag-st");if(b){b.className="ag-badge off";b.textContent="● Server offline"}});
async function send(text){
text=(text||"").trim();if(!text||busy)return;busy=true;$("#ag-send").disabled=true;
$("#ag-q").value="";add("user",esc(text));AG_HIST.push({role:"user",text:text});
const t=add("assistant",'<span class="ag-typing"><span></span><span></span><span></span></span>');
try{
const r=await api("POST","/api/agent",{message:text,history:AG_HIST.slice(-9,-1)});
t.innerHTML=agMd(r.reply)+'<div class="ag-meta">'+(r.mode==="ai"?"AI jawab":"Offline jawab (database)")+(r.note?" • "+esc(r.note):"")+'</div>';
AG_HIST.push({role:"assistant",text:r.reply});
}catch(e){t.innerHTML='<p style="color:var(--red)"><b>Error:</b> '+esc(e.message)+'</p>'}
busy=false;const sb=$("#ag-send");if(sb)sb.disabled=false;box.scrollTop=box.scrollHeight;
}
$("#ag-send").onclick=()=>send($("#ag-q").value);
$("#ag-q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("#ag-q").value)}});
$$(".ag-chip").forEach(b=>b.onclick=()=>send(b.dataset.q));
$("#ag-clear").onclick=()=>{AG_HIST=[];box.innerHTML="";welcome()};
}

async function boot(){
try{
if(!CLINIC){renderLogin();return}
try{CLINIC_INFO=await api("GET","/api/clinic/"+encodeURIComponent(CLINIC))}
catch(e){if(!API_OK)throw e;CLINIC="";CLINIC_INFO=null;try{localStorage.removeItem("mcms_clinic")}catch(x){}renderLogin(e.message);return}
await seed();
await loadData();
const oc=ownerCreds();
if(oc){try{await api("GET","/api/master/clinics");app.user={id:"owner",username:oc.u,fullName:"Owner ("+oc.u+")",role:"owner",permissions:ALL_PERMS.slice(),active:true}}catch(e){sessionStorage.removeItem("abraj_owner")}}
const sid=sessionStorage.getItem("abraj_session_user");
if(!app.user&&sid){const u=await qGet("users",sid);if(u&&u.active)app.user=u}
/* hash routing (supports #emr:MRNO) */
const applyHash=()=>{
const h=location.hash.replace(/^#/,"");
if(!h)return;
const parts=h.split(":");
if(parts[0]==="emr"&&parts[1]){go("emr");pageEMR(parts[1])}
else if(NAV.some(n=>n.key===parts[0]))go(parts[0]);
};
window.addEventListener("hashchange",()=>{if(app.user)applyHash()});
if(app.user){go("dashboard");applyHash()}
else renderLogin();
}catch(err){console.error(err);
mount('<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#1e3a8a;color:#fff;text-align:center;padding:20px"><div><p style="font-size:18px;font-weight:700">Server / Database Error</p><p style="font-size:13px;opacity:.9;margin-top:8px">'+esc(err.message)+'</p><p style="font-size:12px;opacity:.75;margin-top:10px">Checklist: (1) server computer par <b>node server.js</b> chal raha ho, (2) MySQL service running ho, (3) server.js mein DB user/password sahi ho, (4) firewall mein port 4000 allow ho.</p></div></div>')}
}
boot();
</script>
