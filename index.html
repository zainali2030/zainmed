<title>ZainMed — Clinic Management System</title>
<style>
/* ================= DESIGN (same blue theme) ================= */
:root{
--blue-900:#1e3a8a;--blue-800:#1e40af;--blue-700:#1d4ed8;--blue-600:#2563eb;--blue-500:#3b82f6;
--blue-100:#dbeafe;--blue-50:#eff6ff;--slate-900:#0f172a;--slate-800:#1e293b;--slate-700:#334155;
--slate-600:#475569;--slate-500:#64748b;--slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;
--slate-100:#f1f5f9;--slate-50:#f8fafc;--green:#059669;--green-bg:#ecfdf5;--green-bd:#a7f3d0;
--red:#e11d48;--red-bg:#fff1f2;--red-bd:#fecdd3;--amber:#d97706;--amber-bg:#fffbeb;--amber-bd:#fde68a;
--violet:#7c3aed;--violet-bg:#f5f3ff;--cyan:#0891b2;--cyan-bg:#ecfeff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--slate-100);color:var(--slate-900);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--slate-200)}::-webkit-scrollbar-thumb{background:var(--slate-400);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:var(--slate-500)}
/* layout */
#app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:260px;background:linear-gradient(to bottom,var(--blue-900),#172554);color:#bfdbfe;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.sb-brand{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-logo{width:44px;height:44px;background:#fff;border-radius:10px;display:grid;place-items:center;flex:none}
.sb-name{font-size:13px;font-weight:800;color:#fff;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-time{font-size:10px;color:#93c5fd}
.sb-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:none;background:none;color:#bfdbfe;font-size:13px;font-weight:600;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:#fff;color:var(--blue-900);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px}
.sb-foot .row{display:flex;justify-content:space-between;margin-bottom:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:#34d399}.dot.off{background:#fbbf24}
.main-wrap{flex:1;margin-left:260px;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--slate-200);padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.topbar h1{font-size:18px;font-weight:800}
.topbar .sub{font-size:11px;color:var(--slate-500)}
.clock{text-align:right;font-size:12px;font-weight:700;margin-left:auto;white-space:nowrap}
.clock small{display:block;font-weight:400;color:var(--slate-500);font-size:10px}
.user-chip{text-align:right;border-left:1px solid var(--slate-200);padding-left:12px;font-size:12px;font-weight:700}
.user-chip small{display:block;font-size:10px;text-transform:uppercase;color:var(--blue-700)}
.icon-btn{border:1px solid var(--slate-300);background:#fff;border-radius:8px;padding:8px;color:var(--slate-600)}
.icon-btn:hover{background:var(--red-bg);color:var(--red)}
.hamburger{display:none;border:1px solid var(--slate-300);background:#fff;border-radius:8px;padding:8px 10px}
.backup-banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--amber-bg);border-bottom:1px solid var(--amber-bd);color:#92400e;padding:8px 16px;font-size:13px;font-weight:600}
footer.app-foot{border-top:1px solid var(--slate-200);background:#fff;padding:12px 16px;text-align:center;font-size:11px;color:var(--slate-500)}
.content{flex:1;padding:16px 24px;max-width:1400px;width:100%}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:30;display:none}
.backdrop.show{display:block}
/* cards & panels */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:16px}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--slate-200);background:rgba(248,250,252,.8);border-radius:12px 12px 0 0}
.card-h h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--slate-700)}
.card-h .sub{font-size:11px;color:var(--slate-500)}
.card-b{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat .ico{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.stat .lbl{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--slate-500);letter-spacing:.03em}
.stat .val{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .sub{font-size:11px;color:var(--slate-500)}
.blue-g{background:linear-gradient(135deg,#2563eb,#1d4ed8)}.green-g{background:linear-gradient(135deg,#059669,#047857)}
.amber-g{background:linear-gradient(135deg,#f59e0b,#d97706)}.rose-g{background:linear-gradient(135deg,#e11d48,#be123c)}
.violet-g{background:linear-gradient(135deg,#7c3aed,#6d28d9)}.slate-g{background:linear-gradient(135deg,#334155,#1e293b)}
.cyan-g{background:linear-gradient(135deg,#0891b2,#0e7490)}
.mini-stat{border-radius:12px;border:1px solid;padding:14px}
.mini-stat .lbl{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.8}
.mini-stat .val{font-size:18px;font-weight:800}
.mb{margin-bottom:12px}.mt{margin-top:12px}.flex{display:flex}.aic{align-items:center}.jb{justify-content:space-between}.fw{flex-wrap:wrap}.g8{gap:8px}.g12{gap:12px}
/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--slate-600);margin-bottom:4px}
.field label .req{color:var(--red)}
.inp{width:100%;border:1px solid var(--slate-300);background:#fff;border-radius:8px;padding:10px 12px;font-size:14px;color:var(--slate-900);box-shadow:0 1px 2px rgba(0,0,0,.05);outline:none}
.inp:focus{border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}
.inp:disabled{background:var(--slate-100)}
textarea.inp{min-height:80px;resize:vertical}
select.inp{cursor:pointer}
.hint{font-size:11px;color:var(--slate-500);margin-top:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid transparent;font-weight:600;padding:9px 16px;font-size:13px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.lg{padding:13px 22px;font-size:15px}
.btn.block{width:100%}
.btn-primary{background:var(--blue-700);color:#fff;border-color:var(--blue-700)}.btn-primary:hover{background:var(--blue-800)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}.btn-success:hover{background:#047857}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}.btn-danger:hover{background:#be123c}
.btn-warn{background:#f59e0b;color:#fff;border-color:#f59e0b}.btn-warn:hover{background:#d97706}
.btn-dark{background:var(--slate-800);color:#fff;border-color:var(--slate-800)}.btn-dark:hover{background:var(--slate-900)}
.btn-neutral{background:var(--slate-100);color:var(--slate-800);border-color:var(--slate-300)}.btn-neutral:hover{background:var(--slate-200)}
.btn-outline{background:#fff;color:var(--blue-800);border-color:#93c5fd}.btn-outline:hover{background:var(--blue-50)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--slate-200);border-radius:8px}
table.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:13px}
.tbl thead tr{background:var(--blue-700);color:#fff}
.tbl th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--slate-100);vertical-align:middle}
.tbl tbody tr:hover{background:rgba(239,246,255,.6)}
.empty-row td{padding:36px;text-align:center;color:var(--slate-400)}
.mr{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;color:var(--blue-800)}
.tok{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 8px;background:var(--slate-800);color:#fff;border-radius:6px;font-size:12px;font-weight:700}
.badge{display:inline-block;border-radius:99px;border:1px solid;padding:2px 9px;font-size:11px;font-weight:700}
.badge.green{background:var(--green-bg);color:#047857;border-color:var(--green-bd)}
.badge.red{background:var(--red-bg);color:#be123c;border-color:var(--red-bd)}
.badge.amber{background:var(--amber-bg);color:#b45309;border-color:var(--amber-bd)}
.badge.blue{background:var(--blue-50);color:var(--blue-700);border-color:var(--blue-100)}
.badge.violet{background:var(--violet-bg);color:var(--violet);border-color:#ddd6fe}
.badge.slate{background:var(--slate-100);color:var(--slate-600);border-color:var(--slate-200)}
.sum-box{background:var(--slate-50);border:1px solid var(--slate-200);border-radius:8px;padding:12px}
.sum-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.sum-row b{font-weight:600;color:var(--slate-700)}

@media print{
  /* Hide the complete application, including modals appended directly to BODY. */
  html,body{background:#fff!important;margin:0!important;padding:0!important;width:100%!important;height:auto!important;overflow:visible!important}
  body *{visibility:hidden!important}
  #root{display:none!important;visibility:hidden!important}
  /* The print canvas is the only visible content on paper/PDF. */
  #print-root,
  #print-root *{visibility:visible!important}
  #print-root{
    display:block!important;position:absolute!important;top:0!important;left:0!important;
    right:auto!important;width:100%!important;max-width:100%!important;min-height:0!important;
    margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;
    background:#fff!important;color:#000!important;overflow:visible!important;

  }

  #print-root tr{page-break-inside:avoid;break-inside:avoid}
  #print-root img{max-width:100%!important}
  #print-root button,#print-root .no-print{display:none!important}
}

.zm-logo{background:var(--zm-logo) center/contain no-repeat!important;box-shadow:none!important;border-radius:0!important;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 9px rgba(255,255,255,.5))}
.zm-logo svg{display:none}
body{background:#06182b;background-image:radial-gradient(60% 45% at 6% 0%,rgba(34,211,238,.40),transparent 70%),radial-gradient(50% 50% at 100% 8%,rgba(59,130,246,.50),transparent 70%),radial-gradient(70% 60% at 60% 100%,rgba(20,184,166,.38),transparent 70%),linear-gradient(160deg,#071d33,#0c3a5c 55%,#0f5a73);background-attachment:fixed;color:var(--slate-900)}
/* sidebar */
.sidebar{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05)),rgba(8,30,52,.58);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22);border-radius:0 24px 24px 0}
@media(min-width:1024px){.sidebar{top:12px;bottom:12px;left:12px;width:250px;border-radius:26px}.main-wrap{margin-left:274px}}
.sb-brand{border-bottom:1px solid rgba(255,255,255,.14);padding:18px 16px}
.sb-logo{width:60px;height:60px}
.sb-name{font-size:19px;font-weight:800;letter-spacing:.3px;color:#fff}
.sb-clinic{font-size:12px;font-weight:700;color:#67e8f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sb-time{color:#9fd0ee}
.nav-item{color:#cfe8ff;border-radius:14px;padding:11px 13px}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.active{background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#03213a;font-weight:800;box-shadow:0 8px 22px rgba(34,211,238,.45)}
.nav-group{position:relative}.nav-caret{margin-left:auto;transition:transform .2s;opacity:.8}.nav-group.open .nav-caret{transform:rotate(180deg)}
.nav-group.open{background:rgba(255,255,255,.08);color:#fff}
.nav-sub{display:none;margin:2px 0 6px 18px;padding-left:8px;border-left:1px solid rgba(255,255,255,.2)}.nav-sub.open{display:block}
.nav-sub .nav-item{padding:9px 12px;font-size:12.5px}
.sb-foot{border-top:1px solid rgba(255,255,255,.14)}
/* floating top bar */
.topbar{margin:12px 16px 0;border-radius:22px;top:12px;background:rgba(8,30,52,.52);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.28);color:#fff}
.topbar h1{color:#fff}.topbar .sub{color:#9fd0ee}
.clock{color:#fff}.clock small{color:#9fd0ee}
.user-chip{color:#fff;border-left-color:rgba(255,255,255,.22)}.user-chip small{color:#67e8f9}
.icon-btn,.hamburger{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff;border-radius:12px}
.icon-btn:hover{background:rgba(244,63,94,.35);color:#fff}
.net-pill{backdrop-filter:blur(8px)}
.backup-banner{margin:12px 16px 0;border-radius:16px;background:rgba(255,247,222,.88);backdrop-filter:blur(12px);border:1px solid rgba(251,191,36,.55)}
footer.app-foot{background:transparent;border-top:0;color:#9fd0ee}
/* cards */
.card,.stat,.preview-box{background:rgba(255,255,255,.74);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 10px 36px rgba(3,20,40,.28)}
.card-h{background:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.6);border-radius:20px 20px 0 0}
.stat{transition:transform .2s,box-shadow .2s}
.stat:hover,.card:hover{transform:translateY(-2px);box-shadow:0 16px 44px rgba(3,20,40,.36)}
.stat .ico{border-radius:16px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.mini-stat,.sum-box,.info-tile{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background-color:rgba(255,255,255,.55);border-radius:16px}
.inp{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.85);border-radius:12px}
.inp:focus{background:#fff;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.35)}
.btn{border-radius:12px;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-color:transparent}

/* GS1 DataMatrix / QR (DRAP track & trace) se GTIN, batch, expiry nikalna */
function parseGS1(raw){
  let s=String(raw||"").replace(/^\](d2|Q3|C1)/,""),o={};
  if(/\(\d{2,4}\)/.test(s)){const re=/\((\d{2,4})\)([^(]*)/g;let m;while((m=re.exec(s)))o[m[1]]=m[2].trim()}
  else{
    const fixed={"00":18,"01":14,"02":14,"11":6,"13":6,"15":6,"16":6,"17":6,"20":2},vari={"10":1,"21":1,"22":1,"30":1,"37":1,"240":1,"241":1,"250":1,"251":1,"253":1};
    let i=0;
    while(i<s.length){
      if(s[i]==="\x1d"){i++;continue}
      const a2=s.substr(i,2),a3=s.substr(i,3);
      if(fixed[a2]){o[a2]=s.substr(i+2,fixed[a2]);i+=2+fixed[a2]}
      else if(vari[a3]){let j=s.indexOf("\x1d",i+3);if(j<0)j=s.length;o[a3]=s.substring(i+3,j);i=j}
      else if(vari[a2]){let j=s.indexOf("\x1d",i+2);if(j<0)j=s.length;o[a2]=s.substring(i+2,j);i=j}
      else break;
    }
  }
  const dt=v=>{v=String(v||"");if(!/^\d{6}$/.test(v))return "";const y=2000+(+v.slice(0,2)),m=v.slice(2,4);let d=v.slice(4,6);
    if(+m<1||+m>12)return "";if(d==="00")d=String(new Date(y,+m,0).getDate()).padStart(2,"0");return y+"-"+m+"-"+d};
  const g={gtin:(o["01"]||"").replace(/\D/g,""),expiry:dt(o["17"]),mfg:dt(o["11"]),batch:o["10"]||"",serial:o["21"]||""};
  return (g.gtin||g.expiry||g.batch)?g:null;
}

function padMr(mr){if(!mr)return"";if(!/\d/.test(mr))return mr;const m=mr.match(/(\d{4})\/(\d+)/);if(m)return m[1]+"/"+m[2].padStart(4,"0");const yr=new Date().getFullYear();const dg=mr.replace(/\D/g,"");return yr+"/"+dg.padStart(4,"0")}
function mrDigits(mr){const m=mr.match(/\/(\d+)/);return m?m[1]:mr.replace(/\D/g,"")}

/* ============================================================
   OFFLINE-FIRST LAYER  (Internet ho to server, na ho to is device ki local copy)
   • Internet ho  : data seedha server (MySQL) par save hota hai aur local copy bhi update hoti hai
   • Internet na ho: data is device (IndexedDB) mein save hota hai aur "outbox" mein line lagti hai
   • Internet wapas: outbox khud server par bhej di jati hai (sync) — kuch dobara likhna nahi parta
   ============================================================ */
const NET={offlineUntil:0,flushing:null,state:"",retry:false};
function netOK(){return navigator.onLine!==false&&Date.now()>=NET.offlineUntil}
async function api(method,path,body,opt){
opt=opt||{};
if(!opt.force&&!netOK()){API_OK=false;const e=new Error("Internet nahi hai — offline mode");e.net=true;throw e}
let r;const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),opt.timeout||12000);
try{
r=await fetch(API_BASE+path,{method:method,signal:ctl.signal,headers:Object.assign({"Content-Type":"application/json","X-Clinic":CLINIC||""},ownerCreds()?{"x-master-user":ownerCreds().u,"x-master-key":ownerCreds().k}:{}),body:body===undefined?undefined:JSON.stringify(body)});
}catch(e){
clearTimeout(tm);API_OK=false;NET.offlineUntil=Date.now()+8000;setNetState();
const er=new Error(e&&e.name==="AbortError"?"Server ne bohat der tak jawab nahi diya (timeout). Dobara try karein.":"Server se connection nahi hua ("+(API_BASE||location.host)+"). Offline mode mein kaam chal sakta hai.");er.net=true;throw er}
clearTimeout(tm);API_OK=true;NET.offlineUntil=0;
if(!r.ok){let msg="HTTP "+r.status;try{const j=await r.json();if(j&&j.error)msg=j.error}catch(e){}
const er=new Error(msg);er.status=r.status;
if(r.status===502||r.status===503||r.status===504){er.net=true;NET.offlineUntil=Date.now()+8000;setNetState()}
throw er}
return r.json();
}

const _dbs={};let OB=[];let OB_FOR="";
const RECENT=new Map();const CACHE_T={};
function recKey(o){const k=o&&(o.id!==undefined&&o.id!==null&&o.id!==""?o.id:o.key);return k===undefined||k===null||k===""?"":String(k)}
function idb(){const c=CLINIC||"";if(_dbs[c])return _dbs[c];
_dbs[c]=new Promise(res=>{try{if(!window.indexedDB)return res(null);
const r=indexedDB.open("zainmed_clinic_"+c,1);
r.onupgradeneeded=()=>{const d=r.result;const kv=d.createObjectStore("kv",{keyPath:"k"});kv.createIndex("s","s");d.createObjectStore("outbox",{keyPath:"n",autoIncrement:true});d.createObjectStore("meta",{keyPath:"k"})};
r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
return _dbs[c]}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txDone(tx){return new Promise(res=>{tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false)})}
async function cGetAll(store){try{const d=await idb();if(!d)return [];const rows=await reqP(d.transaction("kv").objectStore("kv").index("s").getAll(store));return rows.map(x=>x.o)}catch(e){return []}}
async function cGet(store,key){try{const d=await idb();if(!d)return null;const x=await reqP(d.transaction("kv").objectStore("kv").get(store+"|"+key));return x?x.o:null}catch(e){return null}}
async function cPutMany(store,arr){try{const d=await idb();const t=Date.now();arr.forEach(o=>{const k=recKey(o);if(k)RECENT.set(store+"|"+k,{ts:t,o:o})});if(!d||!arr.length)return;const tx=d.transaction("kv","readwrite");const os=tx.objectStore("kv");arr.forEach(o=>{const k=recKey(o);if(k)os.put({k:store+"|"+k,s:store,o:o})});await txDone(tx)}catch(e){}}
async function cPut(store,obj){return cPutMany(store,[obj])}
async function cDel(store,key){try{const d=await idb();RECENT.set(store+"|"+key,{ts:Date.now(),o:null});if(!d)return;const tx=d.transaction("kv","readwrite");tx.objectStore("kv").delete(store+"|"+key);await txDone(tx)}catch(e){}}
function cReplace(store,arr,t0){return idb().then(d=>new Promise(res=>{if(!d)return res();
try{const tx=d.transaction("kv","readwrite"),os=tx.objectStore("kv");
const keep=new Map();RECENT.forEach((v,k)=>{if(v.ts>=t0&&k.indexOf(store+"|")===0)keep.set(k,v)});
const cur=os.index("s").openKeyCursor(IDBKeyRange.only(store));
cur.onsuccess=()=>{const c=cur.result;if(c){os.delete(c.primaryKey);c.continue()}else{
for(const o of arr){const k=recKey(o);if(!k)continue;const kk=store+"|"+k;if(keep.has(kk))continue;os.put({k:kk,s:store,o:o})}
keep.forEach((v,kk)=>{if(v.o)os.put({k:kk,s:store,o:v.o})})}};
tx.oncomplete=()=>res();tx.onerror=()=>res();tx.onabort=()=>res()}catch(e){res()}}))}
async function metaGet(k){try{const d=await idb();if(!d)return null;const x=await reqP(d.transaction("meta").objectStore("meta").get(k));return x?x.v:null}catch(e){return null}}
async function metaSet(k,v){try{const d=await idb();if(!d)return;const tx=d.transaction("meta","readwrite");tx.objectStore("meta").put({k:k,v:v});await txDone(tx)}catch(e){}}
/* ---- outbox (jo abhi server tak nahi pahunch saka) ---- */
async function obLoad(){if(OB_FOR===(CLINIC||"")&&OB.length)return;OB_FOR=CLINIC||"";OB=[];
try{const d=await idb();if(d){OB=await reqP(d.transaction("outbox").objectStore("outbox").getAll())}}catch(e){}
OB.sort((a,b)=>a.n-b.n);setNetState()}
async function obAdd(op){
if(op.op==="put"){const k=recKey(op.obj);for(let i=OB.length-1;i>=0;i--){const q=OB[i];if(q.store!==op.store)continue;
if(q.op==="del"&&String(q.key)===k)break;
if(q.op==="put"&&recKey(q.obj)===k&&!q.failed){q.obj=op.obj;await obSave(q);setNetState();return}}}
if(op.op==="seq"){const q=OB.find(x=>x.op==="seq"&&x.key===op.key);if(q){q.last=Math.max(q.last,op.last);await obSave(q);setNetState();return}}
op.ts=Date.now();await obSave(op);OB.push(op);setNetState()}
async function obSave(op){try{const d=await idb();if(!d)return;const tx=d.transaction("outbox","readwrite");const r=tx.objectStore("outbox").put(op);r.onsuccess=()=>{op.n=r.result};await txDone(tx)}catch(e){}if(op.n===undefined)op.n=(OB.reduce((m,x)=>Math.max(m,x.n||0),0)+1)}
async function obRemove(op){OB=OB.filter(x=>x!==op);try{const d=await idb();if(d&&op.n!==undefined){const tx=d.transaction("outbox","readwrite");tx.objectStore("outbox").delete(op.n);await txDone(tx)}}catch(e){}setNetState()}
function overlay(store,arr){if(!OB.length)return arr;let ch=false;const m=new Map(arr.map(o=>[recKey(o),o]));
for(const op of OB){if(op.store!==store)continue;
if(op.op==="put"){m.set(recKey(op.obj),op.obj);ch=true}
else if(op.op==="bulk"){op.arr.forEach(o=>m.set(recKey(o),o));ch=true}
else if(op.op==="del"){m.delete(String(op.key));ch=true}}
return ch?Array.from(m.values()):arr}
function ovGet(store,key,val){let out=val;key=String(key);
for(const op of OB){if(op.store!==store)continue;
if(op.op==="put"&&recKey(op.obj)===key)out=op.obj;
else if(op.op==="bulk"){const f=op.arr.find(o=>recKey(o)===key);if(f)out=f}
else if(op.op==="del"&&String(op.key)===key)out=null}
return out}
/* ---- outbox ko server par bhejna ---- */
function flushOutbox(){
if(NET.flushing)return NET.flushing;
if(!OB.length||!netOK())return Promise.resolve(false);
NET.flushing=(async()=>{let did=false;
for(const op of OB.slice()){
if(op.failed&&!NET.retry)continue;
try{
if(op.op==="put")await api("PUT","/api/"+op.store,op.obj,{force:true});
else if(op.op==="bulk")await api("POST","/api/"+op.store+"/bulk",op.arr,{force:true,timeout:90000});
else if(op.op==="del")await api("DELETE","/api/"+op.store+"/"+encodeURIComponent(op.key),undefined,{force:true});
else if(op.op==="seq")await api("POST","/api/seq/"+encodeURIComponent(op.key),{start:1,last:op.last},{force:true});
await obRemove(op);did=true;
}catch(e){
if(e.net)break;
op.failed=e.message;op.tries=(op.tries||0)+1;await obSave(op);
}}
NET.retry=false;setNetState();return did})().finally(()=>{NET.flushing=null});
return NET.flushing}

await cPut(store,obj);await obAdd({op:"put",store:store,obj:obj});flushSoon();return obj}

async function nextSeq(key,start){
if(netOK()){try{await flushOutbox();const j=await api("POST","/api/seq/"+encodeURIComponent(key),{start:start});metaSet("next:"+key,j.value+1);return j.value}catch(e){if(!e.net)throw e}}
let nx=await metaGet("next:"+key);if(nx===null||nx===undefined)nx=start||1;
await metaSet("next:"+key,nx+1);await obAdd({op:"seq",store:"counters",key:key,last:nx});flushSoon();return nx}
async function peekSeq(key,start){
if(netOK()){try{await flushOutbox();const j=await api("GET","/api/seq/"+encodeURIComponent(key)+"?start="+start);metaSet("next:"+key,j.value);return j.value}catch(e){if(!e.net)throw e}}
const nx=await metaGet("next:"+key);return (nx===null||nx===undefined)?(start||1):nx}

}

else if(NET.state==="off"&&st!=="off")try{toast(c.p?"Internet wapas aa gaya — sync ho raha hai…":"Internet wapas aa gaya","success")}catch(e){}

/* ================= COLLECTION MATH ================= */
function calcPeriod(visits,expenses,payments,from,to){
const v=visits.filter(x=>x.status!=="Cancelled"&&inRange(x.date,from,to));
const ex=expenses.filter(x=>inRange(x.date,from,to));
const extra=payments.filter(x=>inRange(x.date,from,to));
const sum=a=>a.reduce((t,n)=>t+(n||0),0);
const extraAmt=sum(extra.map(x=>x.amount));
const received=sum(v.map(x=>x.received))+extraAmt;
const exp=sum(ex.map(x=>x.amount));
return{count:v.length,opd:sum(v.map(x=>x.opdFee)),lab:sum(v.map(x=>x.labTotal)),ultra:sum(v.map(x=>x.ultraTotal)),
other:sum(v.map(x=>x.otherTotal)),gross:sum(v.map(x=>x.total)),discount:sum(v.map(x=>x.discount)),
received:received,due:sum(v.map(x=>x.due)),expenses:exp,net:received-exp,extraPayments:extraAmt};
}

'<tr><td style="font-size:12px;font-weight:600">'+esc(it.description)+' <span style="font-size:10px;text-transform:uppercase;background:var(--slate-100);border-radius:4px;padding:1px 5px;color:var(--slate-500)">'+it.category+"</span></td>"+
'<td><input class="bill-inp" data-rate="'+it.id+'" value="'+it.rate+'"></td><td><input class="bill-inp" style="width:48px" data-qty="'+it.id+'" value="'+it.qty+'"></td>'+
'<td style="font-weight:700;font-size:12px" data-amt="'+it.id+'">'+fmtMoney(it.amount)+'</td><td><button class="btn btn-danger sm" data-del="'+it.id+'">🗑</button></td></tr>').join(""):
'<tr class="empty-row"><td colspan="5">No charges added</td></tr>';
$$("[data-rate]").forEach(i=>i.addEventListener("input",()=>{const it=nv.items.find(x=>x.id===i.dataset.rate);it.rate=num(i.value);it.amount=it.rate*it.qty;updBill()}));
$$("[data-qty]").forEach(i=>i.addEventListener("input",()=>{const it=nv.items.find(x=>x.id===i.dataset.qty);it.qty=Math.max(1,num(i.value));it.amount=it.rate*it.qty;updBill()}));
$$("[data-del]").forEach(b=>b.onclick=()=>{nv.items=nv.items.filter(x=>x.id!==b.dataset.del);updBill()});
const t=totals();
$("#nv-sums").innerHTML=[["OPD / Doctor Fee",t.opd],["Lab Tests",t.lab],["Ultrasound",t.ult],["Other Charges",t.oth],["Sub Total",t.sub],["Discount",-t.disc]]
.map(x=>'<div class="sum-row"><span style="color:var(--slate-600)">'+x[0]+"</span><b>"+C+" "+fmtMoney(x[1])+"</b></div>").join("")+
'<div class="sum-row total"><span style="font-weight:800">TOTAL BILL</span><b>'+C+" "+fmtMoney(t.total)+"</b></div>";
const db2=$("#nv-duebox");db2.textContent=C+" "+fmtMoney(t.due);
db2.style.background=t.due>0?"var(--red-bg)":"var(--green-bg)";
db2.style.color=t.due>0?"#be123c":"#047857";
db2.style.border="1px solid "+(t.due>0?"var(--red-bd)":"var(--green-bd)");
updPreview();
};
const buildVisitObj=(patientId,token,doctorName,vid)=>{
const t=totals();const now=new Date();
const items=[].concat(t.opd>0?[{id:id("chg"),description:doctorName?"OPD Fees ("+doctorName+")":"OPD Fees",category:"opd",rate:t.opd,qty:1,amount:t.opd}]:[],nv.items);
return{id:vid||id("vis"),patientId:patientId,patientName:$("#nv-name").value.trim(),age:$("#nv-age").value,ageUnit:$("#nv-ageunit").value,
gender:$("#nv-gender").value,mobile:$("#nv-mobile").value,address:$("#nv-address").value,token:token,
date:editVisit?editVisit.date:today(),time:editVisit?editVisit.time:timeNow(),shift:$("#nv-shift").value,
referredBy:$("#nv-ref").value||"SELF",doctorId:$("#nv-doc").value,doctorName:doctorName,paymentMethod:$("#nv-pay").value,
items:items,opdFee:t.opd,labTotal:t.lab,ultraTotal:t.ult,otherTotal:t.oth,subTotal:t.sub,discount:t.disc,
total:t.total,received:t.recv,due:t.due,status:t.due<=0?"Paid":t.recv>0?"Partial":"Due",
diagnosis:$("#nv-dx").value,prescription:$("#nv-rx").value,notes:$("#nv-notes").value,
createdBy:editVisit?editVisit.createdBy:(app.user.fullName||app.user.username),
createdAt:editVisit?editVisit.createdAt:now.toISOString(),updatedAt:now.toISOString()};
};
const updPreview=()=>{
const v=buildVisitObj(mrNo,num($("#nv-token").value)||0,$("#nv-doc").value?activeDocs.find(d=>d.id===$("#nv-doc").value).name:"","preview");
$("#nv-preview").innerHTML=slipHTML(v,s,"80");
};
updTests();
$("#nv-testq").addEventListener("input",updTests);
["nv-opd","nv-disc","nv-recv","nv-name","nv-age","nv-mobile","nv-token"].forEach(i=>$("#"+i).addEventListener("input",updBill));
$("#nv-doc").addEventListener("change",()=>{const d=activeDocs.find(x=>x.id===$("#nv-doc").value);if(d)$("#nv-opd").value=d.fee;updBill()});
$("#nv-chg-add").onclick=()=>{
const d=$("#nv-chg-desc").value.trim(),a=num($("#nv-chg-amt").value);
if(!d||a<=0){toast("Enter description and amount for additional charge","error");return}
nv.items.push({id:id("chg"),description:d,category:"other",rate:a,qty:1,amount:a});
$("#nv-chg-desc").value="";$("#nv-chg-amt").value="";updBill();

const tokKey=()=>"tokenSeq_"+today()+"_"+($("#nv-doc").value||"all");
const refreshTok=async()=>{if(editVisit)return;try{$("#nv-token").value=await peekSeq(tokKey(),1);updBill()}catch(e){}};
$("#nv-doc").addEventListener("change",refreshTok);refreshTok();
$("#nv-full").onclick=()=>{$("#nv-recv").value=totals().total;updBill()};
$("#nv-none").onclick=()=>{$("#nv-recv").value=0;updBill()};
$("#nv-search").onclick=()=>patientPicker(p=>{
$("#nv-name").value=p.name;$("#nv-age").value=p.age;$("#nv-ageunit").value=p.ageUnit||"Years";
$("#nv-gender").value=p.gender;$("#nv-mobile").value=p.mobile||"";$("#nv-address").value=p.address||"";
nv._patientDbId=p.id;toast("Patient "+padMr(p.patientId)+" loaded","info");updBill();
});
const doSave=async print=>{
if(!$("#nv-name").value.trim()){toast("Patient name is required","error");return}
let token=Math.max(0,Math.trunc(num($("#nv-token").value)));
if(!editVisit){try{token=await nextSeq(tokKey(),1)}catch(e){toast("Token generate nahi hua: "+e.message,"error");return}}
const doc=activeDocs.find(d=>d.id===$("#nv-doc").value);
try{
let patientId,patientDbId=nv._patientDbId;
if(editVisit){
patientId=editVisit.patientId;
const v=buildVisitObj(patientId,token,doc?doc.name:"",editVisit.id);
await qPut("visits",v);
if(patientDbId){const p=app.patients.find(x=>x.id===patientDbId);
if(p)await qPut("patients",Object.assign({},p,{name:v.patientName,age:v.age,ageUnit:v.ageUnit,gender:v.gender,mobile:v.mobile,address:v.address,updatedAt:new Date().toISOString()}))}
await audit(app.user.username,"UPDATE","visits",v.id,"Visit updated for "+patientId);
toast("Visit updated and saved on server ("+patientId+")");
await loadData();if(print==="lab")printLabSlip(v);else if(print)printSlip(v);go("billing");return;
}
if(patientDbId){const p=app.patients.find(x=>x.id===patientDbId);
if(p){patientId=p.patientId;
await qPut("patients",Object.assign({},p,{name:$("#nv-name").value.trim(),age:$("#nv-age").value,ageUnit:$("#nv-ageunit").value,gender:$("#nv-gender").value,mobile:$("#nv-mobile").value,address:$("#nv-address").value,updatedAt:new Date().toISOString()}))}}
else{patientId=await createPatientId(s.patientIdPrefix);
await qPut("patients",{id:id("pat"),patientId:patientId,name:$("#nv-name").value.trim(),age:$("#nv-age").value,ageUnit:$("#nv-ageunit").value,gender:$("#nv-gender").value,mobile:$("#nv-mobile").value,address:$("#nv-address").value,cnic:"",bloodGroup:"",notes:"",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
await audit(app.user.username,"CREATE","patients",patientId,"New patient "+$("#nv-name").value.trim())}
const v=buildVisitObj(patientId,token,doc?doc.name:"");
await qPut("visits",v);
await audit(app.user.username,"CREATE","visits",v.id,"Visit "+patientId+" token "+token+" total "+v.total);
toast("Saved ✔ Patient "+patientId+" • Token "+token);
await loadData();if(print==="lab")printLabSlip(v);else if(print)printSlip(v);go("billing");
}catch(e){console.error(e);toast(e.message||"Could not save the record. Please try again.","error")}
};
$("#nv-save").onclick=()=>doSave(false);
$("#nv-saveprint").onclick=()=>doSave(true);
$("#nv-savelab").onclick=()=>doSave("lab");
$("#nv-clear").onclick=async()=>{
if(($("#nv-name").value||nv.items.length)&&!await confirmBox({title:"Clear Form",message:"All values entered in this form will be cleared. This does not delete any saved record. Continue?",confirmText:"Yes, clear"}))return;
pageNewVisit();
};
$("#nv-reprint").onclick=()=>{if(editVisit)printSlip(editVisit)};
if($("#nv-reprintlab"))$("#nv-reprintlab").onclick=()=>{if(editVisit)printLabSlip(editVisit)};
updBill();
}
function patientPicker(onSelect){
const ov=openModal("Search Existing Patient",
'<input class="inp mb" id="pk-q" placeholder="🔍 Type MR No (2026/0001), name, mobile number or CNIC…" style="font-size:15px;padding:12px" autofocus>'+
'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>MR No</th><th>Name</th><th>Age / Gender</th><th>Mobile</th><th>Last Visit</th><th></th></tr></thead><tbody id="pk-rows"></tbody></table></div>'+
'<p style="font-size:11px;color:var(--slate-500);margin-top:8px">Showing up to 80 matches. Total patients in database: '+app.patients.length+"</p>","",true);
const draw=()=>{
const q=$("#pk-q",ov).value.trim().toLowerCase();
const list=(q?app.patients.filter(p=>p.patientId.toLowerCase().includes(q)||mrDigits(p.patientId).includes(q.replace(/\D/g,""))||p.name.toLowerCase().includes(q)||(p.mobile||"").includes(q)||(p.cnic||"").includes(q)):app.patients).slice(0,80);
$("#pk-rows",ov).innerHTML=list.length?list.map(p=>{
const last=app.visits.find(v=>v.patientId===p.patientId);
return '<tr><td class="mr">'+esc(padMr(p.patientId))+"</td><td style=\"font-weight:600\">"+esc(p.name)+'</td><td style="font-size:12px">'+esc(p.age+" "+p.ageUnit+" • "+p.gender)+'</td><td style="font-size:12px">'+esc(p.mobile||"-")+'</td><td style="font-size:12px">'+(last?fmtDate(last.date):"—")+'</td><td><button class="btn btn-primary sm" data-load="'+p.id+'">LOAD</button></td></tr>'}).join(""):
'<tr class="empty-row"><td colspan="6">No patients found</td></tr>';
$$("[data-load]",ov).forEach(b=>b.onclick=()=>{const p=app.patients.find(x=>x.id===b.dataset.load);ov.remove();onSelect(p)});
};
$("#pk-q",ov).addEventListener("input",draw);draw();
}

function pagePatients(){
const s=app.settings;
$("#page").innerHTML='<div class="card"><div class="card-h"><div><h2>Patient Directory</h2><div class="sub">Permanent patient records in the server database</div></div>'+
'<div class="flex g8"><button class="btn btn-outline sm" id="pt-csv">⬇ EXPORT CSV</button><button class="btn btn-dark sm" id="pt-print">🖨 PRINT LIST</button></div></div>'+
'<div class="card-b"><div class="grid mb" style="grid-template-columns:2fr 1fr"><input class="inp" id="pt-q" style="font-size:15px;padding:12px" placeholder="🔍 Search by MR No, name, mobile or CNIC…"><select class="inp" id="pt-g"><option value="">All Genders</option><option>Male</option><option>Female</option><option>Other</option></select></div>'+
'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>MR No</th><th>Name</th><th>Age / Gender</th><th>Mobile</th><th>Visits</th><th>Total Billed</th><th>Due</th><th>Last Visit</th><th>Actions</th></tr></thead><tbody id="pt-rows"></tbody></table></div>'+
'<p id="pt-more" style="font-size:12px;color:var(--slate-500);margin-top:8px"></p></div></div>';
const stats=pid=>{const vs=app.visits.filter(v=>v.patientId===pid);
return{count:vs.length,last:vs[0]?vs[0].date:"",billed:vs.reduce((a,b)=>a+b.total,0),due:vs.reduce((a,b)=>a+b.due,0)}};
const draw=()=>{
const q=$("#pt-q").value.trim().toLowerCase(),g=$("#pt-g").value;
const list=app.patients.filter(p=>(!g||p.gender===g)&&(!q||p.patientId.toLowerCase().includes(q)||mrDigits(p.patientId).includes(q.replace(/\D/g,""))||p.name.toLowerCase().includes(q)||(p.mobile||"").includes(q)||(p.cnic||"").includes(q)));
$("#pt-more").textContent=list.length>300?"Showing first 300 of "+list.length+". Refine your search.":"";
$("#pt-rows").innerHTML=list.length?list.slice(0,300).map(p=>{
const st=stats(p.patientId);
return '<tr><td class="mr">'+esc(padMr(p.patientId))+'</td><td style="font-weight:600">'+esc(p.name)+'</td><td style="font-size:12px">'+esc(p.age+" "+p.ageUnit+" • "+p.gender)+'</td><td style="font-size:12px">'+esc(p.mobile||"-")+'</td><td style="text-align:center;font-weight:700">'+st.count+'</td><td style="font-size:12px;font-weight:600;white-space:nowrap">'+s.currency+" "+fmtMoney(st.billed)+'</td><td style="font-size:12px;font-weight:700;white-space:nowrap;color:'+(st.due>0?"var(--red)":"var(--slate-400)")+'">'+s.currency+" "+fmtMoney(st.due)+'</td><td style="font-size:12px">'+(st.last?fmtDate(st.last):"—")+"</td>"+
'<td><div class="flex g8"><button class="btn btn-outline sm" data-hist="'+p.patientId+'">HISTORY</button><button class="btn btn-neutral sm" data-edit="'+p.id+'">✏️</button>'+(can("delete")?'<button class="btn btn-danger sm" data-del="'+p.id+'">🗑</button>':"")+"</div></td></tr>"}).join(""):
'<tr class="empty-row"><td colspan="9">No records found</td></tr>';
$$("[data-hist]").forEach(b=>b.onclick=()=>{
const pid=b.dataset.hist,h="#emr:"+pid;
if(location.hash===h){go("emr");pageEMR(pid)}else location.hash=h;
});
$$("[data-edit]").forEach(b=>b.onclick=()=>{const p=app.patients.find(x=>x.id===b.dataset.edit);editPatientModal(p)});
$$("[data-del]").forEach(b=>b.onclick=async()=>{
const p=app.patients.find(x=>x.id===b.dataset.del);
const n=app.visits.filter(v=>v.patientId===p.patientId).length;
if(!await confirmBox({title:"Delete Patient Record",message:"You are about to permanently delete "+p.name+" ("+padMr(p.patientId)+") and unlink "+n+" visit(s). This action cannot be undone. Make sure you have a recent backup.",danger:true,confirmText:"DELETE PERMANENTLY",requireText:"DELETE"}))return;
await removeRecord("patients",p.id);
await audit(app.user.username,"DELETE","patients",p.patientId,"Deleted patient "+p.name);
toast("Patient record deleted","info");draw();
});
};
$("#pt-q").addEventListener("input",draw);$("#pt-g").addEventListener("change",draw);
$("#pt-csv").onclick=()=>downloadCSV("patients.csv",
["MR No","Name","Age","Unit","Gender","Mobile","Address","CNIC","Blood Group","Visits","Total Billed","Due","Registered"],
app.patients.map(p=>{const st=stats(p.patientId);return[padMr(p.patientId),p.name,p.age,p.ageUnit,p.gender,p.mobile,p.address,p.cnic,p.bloodGroup,st.count,st.billed,st.due,(p.createdAt||"").slice(0,10)]}));
$("#pt-print").onclick=()=>printReport({title:"Registered Patients List",subtitle:"Total: "+app.patients.length+" patient(s)",
headers:["MR No","Name","Age","Gender","Mobile","Visits","Total Billed","Due"],
align:["left","left","center","center","left","center","right","right"],
rows:app.patients.map(p=>{const st=stats(p.patientId);return[padMr(p.patientId),p.name,p.age+" "+p.ageUnit,p.gender,p.mobile,st.count,fmtMoney(st.billed),fmtMoney(st.due)]})});
draw();
}

let customM=old&&old.measurements?old.measurements.filter(m=>!usType(startType).meas.includes(m.label)).map(m=>({label:m.label,value:m.value})):[];
const oldChecks=old&&old.checks?old.checks:{};

sec[1].map((v,vi)=>{const k=keyOf(sec[0],v),kp=keep[k],on=kp?kp.on:!!oldChecks[k],dv=kp?kp.d:((old&&old.details&&old.details[k])||"");
return '<label style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #e5e7eb;font-size:13px"><input type="checkbox" data-ck="'+esc(k)+'" data-si="'+si+'" style="margin-top:3px"'+(on?" checked":"")+'><span style="flex:1">'+esc(v)+'</span><input class="inp" data-dt="'+esc(k)+'" placeholder="Size / detail" value="'+esc(dv)+'" style="max-width:170px;padding:6px"></label>'}).join("")+'</div></div>').join("");
ov.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>ov.querySelectorAll('[data-si="'+b.dataset.all+'"]').forEach(c=>c.checked=true));

drawMeas()};
const collectMeas=()=>{ov.querySelectorAll("[data-mv]").forEach(i=>{measVals[i.dataset.mv]=i.value});
customM=Array.from(ov.querySelectorAll("[data-cm]")).map(r=>({label:r.querySelector("[data-cml]").value,value:r.querySelector("[data-cmv]").value}))};

customM.map((m,i)=>'<div class="field" data-cm="'+i+'" style="grid-column:span 2"><div class="flex g8"><input class="inp" data-cml placeholder="Measurement name" value="'+esc(m.label)+'"><input class="inp" data-cmv placeholder="Value" value="'+esc(m.value)+'"><button class="btn btn-danger sm" type="button" data-cmx="'+i+'">✕</button></div></div>').join("");

$q("#usr-addm").onclick=()=>{collectMeas();customM.push({label:"",value:""});drawMeas()};

const build=()=>{
collectMeas();
const t=usType($q("#usr-type").value);
const name=$q("#usr-name").value.trim();

const checks={},details={};

const p=pat;const now=new Date().toISOString();
return Object.assign({},old||{},{
id:old?old.id:id("usr"),
patientId:p?p.patientId:(old?old.patientId:(visit?visit.patientId:"")),
mrNo:p?padMr(p.patientId):(old?old.mrNo:(visit?padMr(visit.patientId):"")),

const r=build();if(!r)return;

const btns=ov.querySelectorAll(".modal-f button");btns.forEach(b=>b.disabled=true);
try{await usSave(r);await audit(app.user.username,old?"UPDATE":"CREATE","usreports",r.id,r.typeName+" — "+r.patientName);
await loadData();toast(old?"Report update ho gayi":"Report save ho gayi");ov.remove();

if(onChange)onChange(r)}catch(e){btns.forEach(b=>b.disabled=false);toast("Save nahi hui: "+(e.message||e),"error")}};
$q("#usr-save").onclick=()=>save("");$q("#usr-a4").onclick=()=>save("A4");$q("#usr-th").onclick=()=>save("TH")}

async function usDelete(r,onChange){

function lbFlag(v,r){
v=String(v==null?"":v).trim();r=String(r==null?"":r).trim();if(!v||!r)return"";
const num=s=>{const m=String(s).replace(/,/g,"").match(/^[<>]?=?\s*(-?\d+(\.\d+)?)$/);return m?parseFloat(m[1]):NaN};

m=r.replace(/,/g,"").match(/^(?:<|<=|up to|less than|below)\s*(-?\d+(\.\d+)?)/i);if(m)return x>parseFloat(m[1])?"H":"";
m=r.replace(/,/g,"").match(/^(?:>|>=|above|more than)\s*(-?\d+(\.\d+)?)/i);if(m)return x<parseFloat(m[1])?"L":"";
return""}
if(/^(negative|non[- ]?reactive|absent|nil|normal|not seen|clear)$/i.test(r)&&v.toLowerCase()!==r.toLowerCase())return"A";
return""}

function pageReports(){
const s=app.settings,C=s.currency;
const TYPES=[["daily-patients","Daily Patient Report"],["daily-collection","Daily Collection Report"],["monthly-collection","Monthly Collection Report"],["doctor-patients","Doctor-wise Patients"],["doctor-collection","Doctor-wise Collection & Commission"],["lab","Laboratory Report"],["ultrasound","Ultrasound Report"],["expenses","Expense Report"],["dues","Due / Balance Report"],["patient-history","Patient History Report"],["audit","Audit Log / Activity Report"]];
let type="daily-patients",from=today(),to=today(),mrq="";
const build=()=>{
const visits=app.visits.filter(v=>v.status!=="Cancelled"&&inRange(v.date,from,to));
const P=calcPeriod(app.visits,app.expenses,app.payments,from,to);
const T=x=>fmtMoney(x);
switch(type){
case"daily-patients":return{title:"Daily Patient Report",
headers:["Date","Token","MR No","Patient","Age/Gender","Mobile","Doctor","Time","Total","Status"],
align:["left","center","left","left","center","left","left","center","right","center"],
rows:visits.map(v=>[fmtDate(v.date),v.token,padMr(v.patientId),v.patientName,v.age+" "+v.ageUnit+"/"+v.gender,v.mobile,v.doctorName||"-",fmtTime(v.time),T(v.total),v.status]),
summary:[["Total Patients",String(visits.length)],["Male",String(visits.filter(v=>v.gender==="Male").length)],["Female",String(visits.filter(v=>v.gender==="Female").length)],["Gross Billing",C+" "+T(P.gross)]]};
case"daily-collection":{
const dates=Array.from(new Set(visits.map(v=>v.date))).sort().reverse();
return{title:"Daily Collection Report",
headers:["Date","Patients","OPD","Lab","Ultrasound","Other","Discount","Gross","Received","Due","Expenses","Net"],
align:["left","center","right","right","right","right","right","right","right","right","right","right"],
rows:dates.map(d=>{const q=calcPeriod(app.visits,app.expenses,app.payments,d,d);return[fmtDate(d),q.count,T(q.opd),T(q.lab),T(q.ultra),T(q.other),T(q.discount),T(q.gross),T(q.received),T(q.due),T(q.expenses),T(q.net)]}),
summary:[["OPD Collection",C+" "+T(P.opd)],["Laboratory Collection",C+" "+T(P.lab)],["Ultrasound Collection",C+" "+T(P.ultra)],["Gross Billing",C+" "+T(P.gross)],["Total Received",C+" "+T(P.received)],["Outstanding Due",C+" "+T(P.due)],["Total Expenses",C+" "+T(P.expenses)],["NET COLLECTION",C+" "+T(P.net)]]}}
case"monthly-collection":{
const months=Array.from(new Set(app.visits.map(v=>v.date.slice(0,7)))).sort().reverse();
return{title:"Monthly Collection Report",
headers:["Month","Patients","OPD","Lab","Ultrasound","Gross","Received","Due","Expenses","Net"],
align:["left","center","right","right","right","right","right","right","right","right"],
rows:months.map(m=>{const q=calcPeriod(app.visits,app.expenses,app.payments,m+"-01",m+"-31");return[m,q.count,T(q.opd),T(q.lab),T(q.ultra),T(q.gross),T(q.received),T(q.due),T(q.expenses),T(q.net)]})}}
case"doctor-patients":case"doctor-collection":{
const rows=app.doctors.map(d=>{
const vs=visits.filter(v=>v.doctorId===d.id);
const fees=vs.reduce((a,v)=>a+v.opdFee,0),tot=vs.reduce((a,v)=>a+v.total,0);
const comm=d.commissionEnabled?Math.round(fees*d.commissionPercent/100):0;
return[d.name,d.specialization,vs.length,T(fees),T(tot),d.commissionEnabled?d.commissionPercent+"%":"-",T(comm),T(fees-comm)]});
const noDoc=visits.filter(v=>!v.doctorId);
if(noDoc.length)rows.push(["(No Doctor / Lab only)","-",noDoc.length,T(noDoc.reduce((a,v)=>a+v.opdFee,0)),T(noDoc.reduce((a,v)=>a+v.total,0)),"-","0",T(noDoc.reduce((a,v)=>a+v.opdFee,0))]);
return{title:type==="doctor-patients"?"Doctor-wise Patients Report":"Doctor-wise Collection & Commission",
headers:["Doctor","Specialization","Patients","OPD Collection","Total Billed","Commission %","Commission","Payable to Clinic"],
align:["left","left","center","right","right","center","right","right"],rows:rows,
summary:[["Total Patients",String(visits.length)],["Total OPD Collection",C+" "+T(P.opd)]]}}
case"lab":case"ultrasound":{
const cat=type,rows=[];let total=0;
visits.forEach(v=>v.items.filter(i=>i.category===cat).forEach(i=>{rows.push([fmtDate(v.date),v.token,padMr(v.patientId),v.patientName,v.doctorName||"-",i.description,i.qty,T(i.amount)]);total+=i.amount}));
return{title:type==="lab"?"Laboratory Report":"Ultrasound Report",
headers:["Date","Token","MR No","Patient","Doctor",type==="lab"?"Test":"Study","Qty","Amount"],
align:["left","center","left","left","left","left","center","right"],rows:rows,
summary:[["Total Items",String(rows.length)],["Total Collection",C+" "+T(total)]]}}
case"expenses":{
const list=app.expenses.filter(e=>inRange(e.date,from,to));
return{title:"Expense Report",headers:["Date","Category","Description","Paid To","Entered By","Amount"],
align:["left","left","left","left","left","right"],
rows:list.map(e=>[fmtDate(e.date),e.category,e.description,e.paidTo||"-",e.createdBy,T(e.amount)]),
summary:[["Total Expenses",C+" "+T(list.reduce((a,b)=>a+b.amount,0))]]}}
case"dues":{
const list=app.visits.filter(v=>v.due>0&&v.status!=="Cancelled"&&inRange(v.date,from,to));
return{title:"Due / Balance Report",headers:["Date","MR No","Patient","Mobile","Doctor","Total","Received","Balance Due"],
align:["left","left","left","left","left","right","right","right"],
rows:list.map(v=>[fmtDate(v.date),padMr(v.patientId),v.patientName,v.mobile||"-",v.doctorName||"-",T(v.total),T(v.received),T(v.due)]),
summary:[["Patients with Balance",String(list.length)],["TOTAL OUTSTANDING",C+" "+T(list.reduce((a,b)=>a+b.due,0))]]}}
case"patient-history":{
const q=mrq.trim(),dg=q.replace(/\D/g,"");
const p=app.patients.find(x=>x.patientId.toLowerCase()===q.toLowerCase())||(dg?app.patients.find(x=>Number(mrDigits(x.patientId))===Number(dg)):null);
const vs=p?app.visits.filter(v=>v.patientId===p.patientId):[];
return{title:"Patient History Report",
subtitle:p?padMr(p.patientId)+" — "+p.name+" • "+p.age+" "+p.ageUnit+" • "+p.gender+" • "+p.mobile:"Enter a valid MR number above",
headers:["Date","Token","Doctor","Charges","Diagnosis","Total","Received","Due"],
align:["left","center","left","left","left","right","right","right"],
rows:vs.map(v=>[fmtDate(v.date),v.token,v.doctorName||"-",v.items.map(i=>i.description).join(", "),v.diagnosis||"-",T(v.total),T(v.received),T(v.due)]),
summary:[["Total Visits",String(vs.length)],["Total Billed",C+" "+T(vs.reduce((a,b)=>a+b.total,0))],["Total Received",C+" "+T(vs.reduce((a,b)=>a+b.received,0))],["Outstanding",C+" "+T(vs.reduce((a,b)=>a+b.due,0))]]}}
default:{
const list=app.audit.filter(a=>inRange(a.ts.slice(0,10),from,to));
return{title:"Audit Log / Activity Report",headers:["Date / Time","User","Action","Module","Reference","Details"],
align:["left","left","left","left","left","left"],
rows:list.map(a=>[new Date(a.ts).toLocaleString(),a.user,a.action,a.entity,a.entityId,a.details]),
summary:[["Total Activities",String(list.length)]]}}
}
};

function dowKey(d){return ["sun","mon","tue","wed","thu","fri","sat"][new Date(d+"T00:00:00").getDay()]}
function daysInMonth(ym){const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()}
function staffAttKey(staffId,date){return "att_"+staffId+"_"+date}
function adjKey(stId,month){return "adj_"+stId+"_"+month}
function attOf(st,month){return app.attendance.filter(a=>a.staffId===st.id&&a.date&&a.date.slice(0,7)===month&&!a.kind)}
function adjOf(st,month){return app.attendance.find(a=>a.id===adjKey(st.id,month))||{advance:0,bonus:0,otHours:0,fine:0,note:""}}
function payBasis(){const c=app.attendance.find(a=>a.id==="cfg_pay");return (c&&c.payBasis)||"cal"}
function defStatus(st,date){return (st.roster&&st.roster[dowKey(date)])==="Off"?"O":"P"}
/* AUTO CALCULATION: salary, absent/half-day katauti, overtime, bonus, advance, fine => net */
function calcPay(st,month){
const dim=daysInMonth(month),pb=payBasis(),basis=pb==="30"?30:pb==="26"?26:dim;
const recs=attOf(st,month);const c={P:0,A:0,L:0,H:0,O:0};recs.forEach(r=>{if(c[r.status]!==undefined)c[r.status]++});
const perDay=num(st.salary)/basis;
const absentDed=Math.round(c.A*perDay),halfDed=Math.round(c.H*perDay/2);
const adj=adjOf(st,month);
const otRate=num(st.otRate)||Math.round(perDay/8);
const ot=Math.round(num(adj.otHours)*otRate),bonus=num(adj.bonus),advance=num(adj.advance),fine=num(adj.fine);
const gross=num(st.salary)+ot+bonus;
const net=Math.max(0,Math.round(gross-absentDed-halfDed-advance-fine));
return {c,perDay,absentDed,halfDed,ot,otRate,bonus,advance,fine,gross,net,adj,basis,dim,unmarked:Math.max(0,dim-recs.length)};
}

$("#rs-btn").onclick=()=>$("#rs-file").click();
$("#rs-file").addEventListener("change",async e=>{
const file=e.target.files&&e.target.files[0];if(!file)return;
try{
const txt=await readAsText(file);const pkg=JSON.parse(txt);
if(!pkg||!pkg.data||typeof pkg.data!=="object"){toast("This file is not a valid backup file","error");return}
const total=Object.values(pkg.data).reduce((a,arr)=>a+(Array.isArray(arr)?arr.length:0),0);
const mode=$("#rs-mode").value;
const ok=await confirmBox({title:mode==="replace"?"Replace Entire Database":"Merge Backup Into Database",
message:mode==="replace"?"This will DELETE all current records in the database and restore "+total+" record(s) from the backup taken on "+new Date(pkg.exportedAt).toLocaleString()+". This cannot be undone.":"This will add/update "+total+" record(s) from the backup taken on "+new Date(pkg.exportedAt).toLocaleString()+". Existing records with the same ID will be overwritten.",
danger:mode==="replace",confirmText:mode==="replace"?"REPLACE ALL DATA":"MERGE DATA",requireText:mode==="replace"?"RESTORE":null});
if(!ok)return;
for(const st of STORES){const arr=pkg.data[st];if(!Array.isArray(arr))continue;if((st==="users"||st==="settings")&&!isOwner())continue;
if(mode==="replace")await qClear(st);await qBulk(st,arr)}
await loadData();
await audit(app.user.username,"RESTORE","database","all",mode+" restore of "+total+" records");
toast("Database restored successfully ("+total+" records)");go("backup");
}catch(err){console.error(err);toast("Could not read that backup file","error")}
e.target.value="";
});
$("#bk-erase").onclick=async()=>{
if(!await confirmBox({title:"Erase Entire Server Database",message:"This permanently deletes ALL patients, visits, doctors, tests, expenses, users and settings from the MySQL database. Export a backup first! This action cannot be undone.",danger:true,confirmText:"ERASE EVERYTHING",requireText:"ERASE"}))return;
for(const st of STORES)await qClear(st);
await loadData();toast("Database erased. Reloading to re-initialise…","info");
setTimeout(()=>location.reload(),1500);
};
}

const AG_SUGGEST=["Aaj kitni collection hui?","Aaj ke patients dikhao","Kis ka due baqaya hai?","Doctor-wise report","Is mahine ka kharcha aur net","Pichle 7 din ka khulasa","Low stock dawaiyan","Aaj ki appointments"];
let AG_HIST=[];
function agMd(t){
const lines=esc(t).split("\n");let out="",inUl=false,tbl=[];
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const flushT=()=>{if(!tbl.length)return;const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r.replace(/\s/g,"")));
out+="<table>"+rows.map((r,i)=>{const c=r.replace(/^\||\|$/g,"").split("|").map(x=>inl(x.trim()));return "<tr>"+c.map(x=>i===0?"<th>"+x+"</th>":"<td>"+x+"</td>").join("")+"</tr>"}).join("")+"</table>";tbl=[]};
const flushU=()=>{if(inUl){out+="</ul>";inUl=false}};
for(const ln of lines){
if(/^\s*\|/.test(ln)){flushU();tbl.push(ln);continue}
flushT();
if(/^\s*[-*•]\s+/.test(ln)){if(!inUl){out+="<ul>";inUl=true}out+="<li>"+inl(ln.replace(/^\s*[-*•]\s+/,""))+"</li>";continue}
flushU();
if(!ln.trim())continue;
out+="<p>"+inl(ln.replace(/^#+\s*/,"<b>")+(/^#+\s/.test(ln)?"</b>":""))+"</p>";
}
flushT();flushU();return out;
}

$("#page").innerHTML=
'<div class="card"><div class="ag-wrap">'+

'<div class="ag-in"><textarea id="ag-q" placeholder="Sawal likhein… (English / Urdu / Roman Urdu)"></textarea><button class="btn btn-primary" id="ag-send">SEND ➤</button></div>'+

api("GET","/api/agent/status").then(s=>{const b=$("#ag-st");if(!b)return;if(s.ai){b.className="ag-badge";b.textContent="● AI ON — "+s.provider}else{b.className="ag-badge off";b.textContent="● Offline mode (database se seedha jawab)"}}).catch(()=>{const b=$("#ag-st");if(b){b.className="ag-badge off";b.textContent="● Server offline"}});
async function send(text){
text=(text||"").trim();if(!text||busy)return;busy=true;$("#ag-send").disabled=true;
$("#ag-q").value="";add("user",esc(text));AG_HIST.push({role:"user",text:text});

try{
const r=await api("POST","/api/agent",{message:text,history:AG_HIST.slice(-9,-1)});
t.innerHTML=agMd(r.reply)+'<div class="ag-meta">'+(r.mode==="ai"?"AI jawab":"Offline jawab (database)")+(r.note?" • "+esc(r.note):"")+'</div>';
AG_HIST.push({role:"assistant",text:r.reply});
}catch(e){t.innerHTML='<p style="color:var(--red)"><b>Error:</b> '+esc(e.message)+'</p>'}
busy=false;const sb=$("#ag-send");if(sb)sb.disabled=false;box.scrollTop=box.scrollHeight;
}
$("#ag-send").onclick=()=>send($("#ag-q").value);
$("#ag-q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("#ag-q").value)}});
$$(".ag-chip").forEach(b=>b.onclick=()=>send(b.dataset.q));
$("#ag-clear").onclick=()=>{AG_HIST=[];box.innerHTML="";welcome()};
}

async function boot(){
try{
if(!CLINIC){renderLogin();return}
try{CLINIC_INFO=await api("GET","/api/clinic/"+encodeURIComponent(CLINIC));try{localStorage.setItem("zm_info_"+CLINIC,JSON.stringify(CLINIC_INFO))}catch(x){}}
catch(e){if(e.net){const ci=cachedInfo(CLINIC);if(ci)CLINIC_INFO=ci;else throw e}
else{CLINIC="";CLINIC_INFO=null;try{localStorage.removeItem("mcms_clinic")}catch(x){}renderLogin(e.message);return}}
await obLoad();
await seed();
await loadData();
const oc=ownerCreds();
if(oc){let okOwner=true;try{await api("GET","/api/master/clinics")}catch(e){if(e&&e.net){/* offline: owner session barkarar rakho */}else{okOwner=false;sessionStorage.removeItem("abraj_owner")}}if(okOwner)app.user={id:"owner",username:oc.u,fullName:"Owner ("+oc.u+")",role:"owner",permissions:ALL_PERMS.slice(),active:true}}
const sid=sessionStorage.getItem("abraj_session_user");
if(!app.user&&sid){const u=await qGet("users",sid);if(u&&u.active)app.user=u}
/* hash routing (supports #emr:MRNO) */
const applyHash=()=>{
const h=location.hash.replace(/^#/,"");
if(!h)return;
const parts=h.split(":");
if(parts[0]==="emr"&&parts[1]){go("emr");pageEMR(parts[1])}
else if(NAV.some(n=>n.key===parts[0])||parts[0]==="medicalstore")go(parts[0]);
};
window.addEventListener("hashchange",()=>{if(app.user)applyHash()});
if(app.user){go("dashboard");applyHash()}
else renderLogin();
}catch(err){console.error(err);
mount('<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#1e3a8a;color:#fff;text-align:center;padding:20px"><div><p style="font-size:18px;font-weight:700">Server / Database Error</p><p style="font-size:13px;opacity:.9;margin-top:8px">'+esc(err.message)+'</p><p style="font-size:12px;opacity:.75;margin-top:10px">Checklist: (1) server computer par <b>node server.js</b> chal raha ho, (2) MySQL service running ho, (3) server.js mein DB user/password sahi ho, (4) firewall mein port 4000 allow ho.</p></div></div>')}
}
boot();

<script>

(function(){
var COLORS=["245,166,35","34,211,238","236,72,153","34,197,94","226,232,240"],ci=0,on=false,actx=null;
function hum(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.setValueAtTime(120,n+.05);g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(.06,n+.06);g.gain.exponentialRampToValueAtTime(.001,n+.35);o.connect(g);g.connect(actx.destination);o.start(n+.05);o.stop(n+.38)}catch(e){}}
function setColor(){var c=COLORS[ci%COLORS.length],r=document.documentElement.style;r.setProperty("--lamp-rgb",c);r.setProperty("--lamp","rgb("+c+")")}
function light(state,wrap,stage){on=state;stage.classList.toggle("lamp-on",on);wrap.classList.toggle("lit",on);var s=stage.querySelector(".lamp-shade");if(s)s.setAttribute("fill",on?"rgb("+COLORS[ci%COLORS.length]+")":"#1f2933")}
function build(wrap){
 if(wrap.dataset.lamp)return;wrap.dataset.lamp="1";

 var stage=document.createElement("div");stage.className="lamp-stage";
 stage.innerHTML='<svg viewBox="0 0 300 380" aria-label="Lamp"><defs><radialGradient id="lg1" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".55"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient></defs>'+
 '<g class="lamp-glow"><path d="M95 120 L10 340 L290 340 L205 120Z" fill="url(#lg1)"/></g>'+
 '<ellipse cx="150" cy="352" rx="70" ry="12" fill="#12181e"/><rect x="142" y="300" width="16" height="52" rx="6" fill="#2a343d"/>'+
 '<path d="M150 300 L110 190 L150 110" stroke="#2a343d" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
 '<circle cx="150" cy="300" r="8" fill="#c9a24a"/><circle cx="110" cy="190" r="7" fill="#c9a24a"/>'+
 '<path d="M105 120 Q150 40 195 120Z" class="lamp-shade" fill="#1f2933" stroke="#3a4651" stroke-width="3"/>'+
 '<ellipse cx="150" cy="122" rx="46" ry="8" fill="#0d1216"/>'+
 '<g class="lamp-cord"><line x1="188" y1="116" x2="188" y2="190" stroke="#c9a24a" stroke-width="2"/><circle cx="188" cy="196" r="7" fill="#c9a24a"/><rect x="174" y="150" width="28" height="60" fill="transparent"/></g></svg>'+
 '<div class="lamp-hint">Pull the cord to turn on the light</div>';
 left.appendChild(stage);
 var wrapBox=document.createElement("div");wrapBox.className="login-glass";
 while(right.firstChild)wrapBox.appendChild(right.firstChild);right.appendChild(wrapBox);
 var cord=stage.querySelector(".lamp-cord");
 function pull(){cord.classList.add("pull");setTimeout(function(){cord.classList.remove("pull")},140);hum();if(on){ci++;setColor();light(true,wrap,stage)}else{light(true,wrap,stage)}}
 cord.addEventListener("click",pull);stage.querySelector("svg").addEventListener("dblclick",function(){light(false,wrap,stage)});
 /* safety: touching the login form always lights it so nobody gets locked out */
 wrapBox.addEventListener("focusin",function(){if(!on)light(true,wrap,stage)});wrapBox.addEventListener("pointerdown",function(){if(!on)light(true,wrap,stage)});
 setColor();
}

new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});scan();
})();
