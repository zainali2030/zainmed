*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;font-size:14px;min-height:100vh;background:#06182b;background-image:radial-gradient(60% 45% at 6% 0%,rgba(34,211,238,.40),transparent 70%),radial-gradient(50% 50% at 100% 8%,rgba(59,130,246,.50),transparent 70%),radial-gradient(70% 60% at 60% 100%,rgba(20,184,166,.38),transparent 70%),linear-gradient(160deg,#071d33,#0c3a5c 55%,#0f5a73);background-attachment:fixed}
button{font-family:inherit;cursor:pointer}
.zm-logo{width:54px;height:54px;flex:none;background:var(--zm-logo) center/contain no-repeat;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 9px rgba(255,255,255,.5))}
.inp{width:100%;padding:11px 13px;border:1px solid rgba(255,255,255,.85);border-radius:12px;font-size:14px;font-family:inherit;background:rgba(255,255,255,.8)}
.inp:focus{outline:0;background:#fff;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.35)}
.btn{border:none;border-radius:12px;padding:10px 15px;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#0ea5e9,#2563eb);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.28)}
.btn.g{background:linear-gradient(135deg,#10b981,#059669)}.btn.r{background:linear-gradient(135deg,#f43f5e,#e11d48)}.btn.n{background:linear-gradient(135deg,#64748b,#475569)}.btn.a{background:linear-gradient(135deg,#f59e0b,#d97706)}.btn.sm{padding:7px 11px;font-size:12px}
.top{position:sticky;top:12px;z-index:20;margin:12px 16px 0;padding:12px 18px;border-radius:22px;background:rgba(8,30,52,.55);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.3);color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;flex:1;color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:rgba(255,255,255,.74);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 10px 36px rgba(3,20,40,.28);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:12px;color:#0c4a6e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:16px;box-shadow:0 10px 36px rgba(3,20,40,.28);font-weight:600;color:#475569;transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:26px;color:#0369a1}
.clinic{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.55);border-radius:16px;padding:14px;margin-bottom:10px}
.clinic.off{background:rgba(255,228,230,.7);border-color:#fecdd3}
.ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.ch h3{font-size:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.b-on{background:#ecfdf5;color:#047857}.b-off{background:#fff1f2;color:#be123c}.b-exp{background:#fffbeb;color:#b45309}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 14px;margin:10px 0;font-size:13px}
.kv span{color:#64748b;font-size:11px;display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05)),rgba(8,30,52,.55);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:28px;max-width:390px;width:100%;color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.lbox .zm-logo{width:170px;height:170px;margin:0 auto 6px}
.lbox h1{font-size:22px;color:#fff;margin-bottom:4px;text-align:center}
.lbox p{text-align:center}
.lbox label{color:#cbd5e1}
.lbox .inp{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.lbox .inp:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.3)}
.err{color:#fecdd3;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(8,30,52,.92);backdrop-filter:blur(12px);color:#fff;padding:11px 20px;border-radius:14px;z-index:99;font-size:13px;border:1px solid rgba(255,255,255,.2)}
.modal{position:fixed;inset:0;background:rgba(4,18,34,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.mbox{background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:22px;max-width:560px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.foot{text-align:center;color:#9fd0ee;font-size:12px;line-height:1.6;padding-bottom:20px}
@media(max-width:600px){.top{margin:8px 8px 0;padding:10px 12px}.wrap{padding:10px}}
</style></head>

var U="",K="",CL=[];
var $=function(s,r){return (r||document).querySelector(s)};
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2800)}
async function api(method,path,body){
  var r=await fetch(path,{method:method,headers:{"Content-Type":"application/json","x-master-user":U,"x-master-key":K},body:body?JSON.stringify(body):undefined});
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||("Error "+r.status));return j;
}
function showLogin(msg){
  $("#app").innerHTML='<div class="login"><div class="lbox"><div class="zm-logo"></div><h1>Owner Panel</h1><p style="color:#9fd0ee;margin-bottom:18px">Multi-Clinic Management System</p>'+
  '<label>Owner Name</label><input class="inp" id="lu" autocomplete="username" style="margin-bottom:10px">'+
  '<label>Password</label><input class="inp" id="lp" type="password" autocomplete="current-password">'+
  '<button class="btn" id="lb" style="width:100%;margin-top:14px;padding:12px">Login</button><div class="err" id="le">'+esc(msg||"")+'</div></div></div>';
  var go=async function(){U=$("#lu").value.trim();K=$("#lp").value;
    try{CL=await api("GET","/api/master/clinics");sessionStorage.setItem("mo",JSON.stringify([U,K]));draw()}
    catch(e){$("#le").textContent=e.message}};
  $("#lb").onclick=go;$("#lp").onkeydown=function(e){if(e.key==="Enter")go()};
}
function status(c){
  var today=new Date().toISOString().slice(0,10);
  if(!c.active)return '<span class="badge b-off">BAND</span>';
  if(c.expiry&&c.expiry<today)return '<span class="badge b-exp">EXPIRED</span>';
  return '<span class="badge b-on">ACTIVE</span>';
}
function draw(){
  var tp=0,tv=0,act=0;CL.forEach(function(c){tp+=c.patients;tv+=c.visits;if(c.active)act++});
  var h='<div class="top"><div class="zm-logo"></div><h1>Owner Panel — '+esc(U)+'</h1><button class="btn n sm" id="rf">⟳ Refresh</button><button class="btn r sm" id="lo">Logout</button></div><div class="wrap">'+
  '<div class="stats"><div class="stat"><b>'+CL.length+'</b>Total Clinics</div><div class="stat"><b>'+act+'</b>Active</div><div class="stat"><b>'+tp+'</b>Patients</div><div class="stat"><b>'+tv+'</b>Visits</div></div>'+
  '<div class="card"><h2>➕ Naya Clinic Banayein</h2><div class="grid">'+
  '<div><label>Account Type</label><select class="inp" id="n-type"><option value="clinic">Clinic</option><option value="medicalstore">Medical Store</option></select></div>'+
  '<div><label>Clinic / Medical Store ID (English)</label><input class="inp" id="n-code"></div>'+
  '<div><label>Clinic / Medical Store Name</label><input class="inp" id="n-name"></div>'+
  '<div><label>Address</label><input class="inp" id="n-addr"></div>'+
  '<div><label>Phone</label><input class="inp" id="n-phone"></div>'+
  '<div><label>Admin Username</label><input class="inp" id="n-au"></div>'+
  '<div><label>Admin Password</label><input class="inp" id="n-ap"></div>'+
  '<div><label>License Expiry (optional)</label><input class="inp" type="date" id="n-exp"></div>'+
  '<div><label>Note</label><input class="inp" id="n-note"></div></div>'+
  '<button class="btn g" id="n-add" style="margin-top:12px">Clinic Banayein</button></div>'+
  '<div class="card"><h2>Clinics & Medical Stores ('+CL.length+')</h2>'+
  (CL.map(function(c){return '<div class="clinic '+(c.active?"":"off")+'"><div class="ch"><div><h3>'+esc(c.name)+' '+status(c)+'</h3><div style="color:#64748b;font-size:12px">'+esc(c.address||"")+' '+esc(c.phone||"")+'</div></div>'+
   '<div class="acts"><button class="btn sm" title="Owner access ke saath clinic kholo" data-open="'+esc(c.code)+'">Open Clinic</button><button class="btn n sm" data-link="'+esc(c.code)+'">🔗 Link</button><button class="btn a sm" data-edit="'+esc(c.code)+'">Edit</button><button class="btn sm '+(c.active?"r":"g")+'" data-tog="'+esc(c.code)+'">'+(c.active?"Band karo":"Active karo")+'</button><button class="btn r sm" data-del="'+esc(c.code)+'">🗑 Delete</button></div></div>'+
   '<div class="kv"><div><span>Clinic ID</span><b>'+esc(c.code)+'</b></div><div><span>Admin Username</span><b>'+esc(c.admin_user)+'</b></div><div><span>Admin Password</span><b>'+esc(c.admin_pass)+'</b></div><div><span>Patients / Visits</span><b>'+c.patients+' / '+c.visits+'</b></div><div><span>Expiry</span><b>'+esc(c.expiry||"Unlimited")+'</b></div><div><span>Created</span><b>'+esc(c.created)+'</b></div></div>'+
   (c.note?'<div style="font-size:12px;color:#64748b">Note: '+esc(c.note)+'</div>':'')+'</div>'}).join("")||'<p>Abhi koi clinic nahi.</p>')+
  '</div><p class="foot">Software developed by ZainMed<br>03702906075 / 03192061690<br>zainaliofficial343@gmail.com</p></div>';
  $("#app").innerHTML=h;
  $("#rf").onclick=reload;$("#lo").onclick=function(){sessionStorage.removeItem("mo");U=K="";showLogin()};
  $("#n-add").onclick=async function(){
    try{await api("POST","/api/master/clinics",{type:$("#n-type").value,code:$("#n-code").value,name:$("#n-name").value,address:$("#n-addr").value,phone:$("#n-phone").value,adminUser:$("#n-au").value,adminPass:$("#n-ap").value,expiry:$("#n-exp").value||null,note:$("#n-note").value});toast("Clinic ban gaya ✔");reload()}
    catch(e){toast(e.message)}};
  document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){try{localStorage.setItem("mcms_owner_handoff",JSON.stringify({u:U,k:K,code:b.dataset.open,t:Date.now()}))}catch(e){}window.open("/","_blank")}});
  document.querySelectorAll("[data-link]").forEach(function(b){b.onclick=function(){var l=location.origin+"/?c="+b.dataset.link;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(l).then(function(){toast("Link copy ho gaya: "+l)},function(){prompt("Clinic ka link copy karein:",l)})}else prompt("Clinic ka link copy karein:",l)}});
  document.querySelectorAll("[data-tog]").forEach(function(b){b.onclick=async function(){var c=CL.find(function(x){return x.code===b.dataset.tog});
    if(c.active&&!confirm(c.name+" ko band kar dein? Is ke users login nahi kar sakenge."))return;
    try{await api("PUT","/api/master/clinics/"+c.code,{active:!c.active});toast("Update ho gaya");reload()}catch(e){toast(e.message)}}});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){delClinic(CL.find(function(x){return x.code===b.dataset.del}))}});
  document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){edit(CL.find(function(x){return x.code===b.dataset.edit}))}});
}
function delClinic(c){
  if(!c)return;
  var m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="mbox"><h2 style="margin-bottom:8px;color:#be123c">🗑 Delete — '+esc(c.name)+'</h2>'+
  '<p style="font-size:13px;color:#475569;margin-bottom:10px">Ye <b>hamesha ke liye</b> delete ho jayega: is ke saare patients, visits, bills, medicines, users aur settings. <b>Wapas nahi aa sakta.</b> Pehle iska backup le lein.</p>'+
  '<p style="font-size:13px;margin-bottom:6px">Confirm karne ke liye Clinic ID likhein: <b>'+esc(c.code)+'</b></p>'+
  '<input class="inp" id="d-conf" autocomplete="off" placeholder="'+esc(c.code)+'">'+
  '<div class="acts" style="margin-top:14px"><button class="btn r" id="d-go" disabled style="opacity:.5">Haan, Delete Karo</button><button class="btn n" id="d-cancel">Cancel</button></div></div>';
  document.body.appendChild(m);
  var inp=$("#d-conf",m),go=$("#d-go",m);
  inp.oninput=function(){var ok=inp.value.trim().toLowerCase()===c.code;go.disabled=!ok;go.style.opacity=ok?1:.5};
  $("#d-cancel",m).onclick=function(){m.remove()};
  go.onclick=async function(){
    go.disabled=true;
    try{var r=await api("DELETE","/api/master/clinics/"+c.code,{confirm:inp.value.trim()});m.remove();toast("Delete ho gaya ✔ ("+(r.deletedRecords||0)+" records)");reload()}
    catch(e){go.disabled=false;toast(e.message)}};
}
async function reload(){try{CL=await api("GET","/api/master/clinics");draw()}catch(e){toast(e.message)}}
function edit(c){
  var m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="mbox"><h2 style="margin-bottom:12px;color:#1e3a8a">Edit — '+esc(c.code)+'</h2><div class="grid">'+
  '<div><label>Account Type</label><select class="inp" id="e-type"><option value="clinic" '+((c.clinic_type||"clinic")==="clinic"?"selected":"")+'>Clinic</option><option value="medicalstore" '+(c.clinic_type==="medicalstore"?"selected":"")+'>Medical Store</option></select></div>'+
  '<div><label>Clinic / Medical Store Name</label><input class="inp" id="e-name" value="'+esc(c.name)+'"></div>'+
  '<div><label>Address</label><input class="inp" id="e-addr" value="'+esc(c.address)+'"></div>'+
  '<div><label>Phone</label><input class="inp" id="e-phone" value="'+esc(c.phone)+'"></div>'+
  '<div><label>Admin Username</label><input class="inp" id="e-au" value="'+esc(c.admin_user)+'"></div>'+
  '<div><label>Admin Password</label><input class="inp" id="e-ap" value="'+esc(c.admin_pass)+'"></div>'+
  '<div><label>License Expiry</label><input class="inp" type="date" id="e-exp" value="'+esc(c.expiry||"")+'"></div></div>'+
  '<label style="margin-top:10px">Note</label><input class="inp" id="e-note" value="'+esc(c.note||"")+'">'+
  '<div class="acts" style="margin-top:14px"><button class="btn g" id="e-save">Save</button><button class="btn n" id="e-cancel">Cancel</button></div></div>';
  document.body.appendChild(m);
  $("#e-cancel",m).onclick=function(){m.remove()};
  $("#e-save",m).onclick=async function(){
    try{await api("PUT","/api/master/clinics/"+c.code,{type:$("#e-type",m).value,name:$("#e-name",m).value,address:$("#e-addr",m).value,phone:$("#e-phone",m).value,adminUser:$("#e-au",m).value,adminPass:$("#e-ap",m).value,expiry:$("#e-exp",m).value||null,note:$("#e-note",m).value});m.remove();toast("Save ho gaya ✔");reload()}
    catch(e){toast(e.message)}};
}
(function(){var s=null;try{s=JSON.parse(sessionStorage.getItem("mo"))}catch(e){}
  if(s){U=s[0];K=s[1];api("GET","/api/master/clinics").then(function(r){CL=r;draw()}).catch(function(){showLogin()})}else showLogin();})();
</script></body></html>
